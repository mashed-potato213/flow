name = "flow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

# Workers Assets（wrangler 4.x）：静态资源由 wrangler 自动处理
# - directory: 静态资源目录（vite build 输出）
# - binding: 可选，worker 代码可通过 env.ASSETS.fetch() 显式访问
[assets]
directory = "./dist"
binding = "ASSETS"

# 顶层只放通用配置；D1/R2/triggers 必须在命名环境里
# wrangler deploy 必须显式指定 --env（避免部署到错的库）

# 生产环境
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "flow-db"
database_id = "64c1235d-bc19-4629-a705-e15c298cf115"

[[env.production.r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups"

[env.production.triggers]
crons = ["0 3 * * *"]

# 开发环境
[env.dev]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "flow-db-dev"
database_id = "632939e6-9ebc-43fb-bfda-0822261a953d"

[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups-dev"

[env.dev.triggers]
crons = []  # dev 环境不开 cron
