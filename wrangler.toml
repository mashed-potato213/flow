name = "flow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

# Workers Assets（wrangler 4.x）：静态资源由 wrangler 自动处理
# - directory: 静态资源目录（vite build 输出）
# - binding: 可选，worker 代码可通过 env.ASSETS.fetch() 显式访问
[assets]
directory = "./dist"
binding = "ASSETS"

# 顶层默认 = 开发环境（指向独立 dev D1 / R2，避免污染生产）
# 这样 wrangler dev / wrangler d1 --local 默认就走 dev
[[d1_databases]]
binding = "DB"
database_name = "flow-db-dev"
database_id = "632939e6-9ebc-43fb-bfda-0822261a953d"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups-dev"

[triggers]
crons = []  # dev 环境不开 cron

# 生产环境（通过 --env production 覆盖）
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "flow-db"
database_id = "64c1235d-bc19-4629-a705-e15c298cf115"

[[env.production.r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups"

[env.production.triggers]
crons = ["0 3 * * *"]
