name = "flow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

# Workers Assets（wrangler 4.x）：静态资源由 wrangler 自动处理
# - directory: 静态资源目录（vite build 输出）
# - binding: 可选，worker 代码可通过 env.ASSETS.fetch() 显式访问
[assets]
directory = "./dist"
binding = "ASSETS"

# 顶层 = 生产环境（worker name 直接为 "flow"，URL: flow.<subdomain>.workers.dev）
# wrangler deploy 必须省略 --env，避免被自动加 -production 后缀

[[d1_databases]]
binding = "DB"
database_name = "flow-db"
database_id = "64c1235d-bc19-4629-a705-e15c298cf115"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups"

[triggers]
crons = ["0 3 * * *"]

# 开发环境（wrangler deploy --env dev，worker name: flow-dev）
[env.dev]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "flow-db-dev"
database_id = "632939e6-9ebc-43fb-bfda-0822261a953d"

[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups-dev"

[env.dev.triggers]
crons = []  # dev 环境不开 cron