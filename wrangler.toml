name = "flow"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

# Workers Assets（wrangler 4.x）：静态资源由 wrangler 自动处理
# - directory: 静态资源目录（vite build 输出）
# - binding: 可选，worker 代码可通过 env.ASSETS.fetch() 显式访问
[assets]
directory = "./dist"
binding = "ASSETS"

# 顶层默认 = 生产环境
# 这样 wrangler deploy 默认走生产，wrangler d1 --local 默认也是生产库本地版
[[d1_databases]]
binding = "DB"
database_name = "flow-db"
database_id = "64c1235d-bc19-4629-a705-e15c298cf115"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups"

[triggers]
crons = ["0 3 * * *"]

# 开发环境（通过 --env dev 切换，独立 D1 / R2）
[env.dev]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "flow-db-dev"
database_id = "632939e6-9ebc-43fb-bfda-0822261a953d"

[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "flow-backups-dev"

[env.dev.triggers]
crons = []  # dev 环境不开 cron
